name: Build & Release (Win/macOS/Linux)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: DrunkenBishopPainter
  MAIN_SCRIPT: painter.py

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pyside6 pyinstaller pillow

      #WINDOWS
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "$env:APP_NAME" `
            --icon "assets/icon.ico" `
            --add-data "assets/icon.png;assets" `
            "$env:MAIN_SCRIPT"

          Compress-Archive -Path "dist/$env:APP_NAME.exe" -DestinationPath "$env:APP_NAME-windows.zip"

      #macOS
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller \
            --windowed \
            --name "$APP_NAME" \
            --icon "assets/icon.icns" \
            --add-data "assets/icon.png:assets" \
            "$MAIN_SCRIPT"

          ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "$APP_NAME-macos.zip"

      #LINUX
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller \
            --onedir \
            --name "$APP_NAME" \
            --add-data "assets/icon.png:assets" \
            "$MAIN_SCRIPT"

          zip -r "$APP_NAME-linux.zip" "dist/$APP_NAME"

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-windows.zip
            ${{ env.APP_NAME }}-macos.zip
            ${{ env.APP_NAME }}-linux.zip
